<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — СкладУчёт</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">СкладУчёт</a>
    <nav class="main-nav" aria-label="Основная навигация">
      <a href="index.html">Главная</a>
      <a href="products.html">Товары</a>
      <a href="warehouses.html">Склады</a>
      <a href="suppliers.html">Поставщики</a>
      <a href="operations.html">Операции</a>
      <a href="inventory.html">Инвентаризация</a>
      <a href="reports.html">Отчёты</a>
      <a href="profile.html">Профиль</a>
    </nav>
  </header>

  <main class="container">
    <h1>Вход</h1>

    <form class="form">
      <div class="form-row">
        <label for="login-email">Email</label>
        <input
          type="email"
          id="login-email"
          name="email"
          placeholder="name@example.com"
          autocomplete="email"
        >
      </div>

      <div class="form-row">
        <label for="login-password">Пароль</label>
        <input
          type="password"
          id="login-password"
          name="password"
          autocomplete="current-password"
        >
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-primary">Войти</button>
      </div>
    </form>

    <p>
      Нет учётной записи?
      <a href="register.html">Зарегистрироваться</a>
    </p>
  </main>
</body>
</html>
