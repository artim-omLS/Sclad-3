<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — СкладУчёт</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">СкладУчёт</a>
    <nav class="main-nav" aria-label="Основная навигация">
      <a href="index.html">Главная</a>
      <a href="products.html">Товары</a>
      <a href="warehouses.html">Склады</a>
      <a href="suppliers.html">Поставщики</a>
      <a href="operations.html">Операции</a>
      <a href="inventory.html">Инвентаризация</a>
      <a href="reports.html">Отчёты</a>
      <a href="profile.html">Профиль</a>
    </nav>
  </header>

  <main class="container">
    <h1>Регистрация</h1>

    <p>
      Демонстрационная форма. Учётная запись пока не создаётся.
      Не вводи настоящий пароль.
    </p>

    <form class="form">
      <div class="form-row">
        <label for="register-name">Имя и фамилия</label>
        <input
          type="text"
          id="register-name"
          name="name"
          placeholder="Иван Иванов"
          autocomplete="name"
        >
      </div>

      <div class="form-row">
        <label for="register-email">Email</label>
        <input
          type="email"
          id="register-email"
          name="email"
          placeholder="name@example.com"
          autocomplete="email"
        >
      </div>

      <div class="form-row">
        <label for="register-password">Пароль</label>
        <input
          type="password"
          id="register-password"
          name="password"
          autocomplete="new-password"
        >
      </div>

      <div class="form-row">
        <label for="register-confirm">Повторите пароль</label>
        <input
          type="password"
          id="register-confirm"
          name="password-confirm"
          autocomplete="new-password"
        >
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-primary">
          Зарегистрироваться
        </button>
      </div>
    </form>

    <p>Уже есть учётная запись? <a href="login.html">Войти</a></p>
  </main>
</body>
</html>
